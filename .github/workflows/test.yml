name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fork:
        description: Also test against an Arbitrum fork
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix docs --ignore-scripts
      - run: npm run setup:contracts
      - name: TypeScript, Solidity, integration tests and site builds
        run: npm run check
        env:
          FOUNDRY_PROFILE: ci
      - name: Arbitrum fork test
        if: github.event_name == 'workflow_dispatch' && inputs.fork
        run: npm run test:fork
